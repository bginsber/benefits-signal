# Benefits Signal — collated feed filter (what reaches the Outlook feed).
# The document store keeps everything for triage; these rules only decide
# what the human-facing RSS feed shows. Adjust here, not in code.
#
# Keywords match at the start of a word, case-insensitive: "pension" matches
# "pensions" but not "suspension".

federal_register:
  # Agencies whose documents always reach the feed, whatever their type (name substring, case-insensitive).
  keep_agencies: [Employee Benefits Security Administration]
  # Individual prohibited-transaction exemptions: EBSA grants many for one company's 401(k) or pension
  # plan. From a kept agency they reach the feed only when the title or abstract names a welfare,
  # multiemployer, or training plan. Class exemptions ("Proposed Class Exemption", amendments to
  # PTE 84-14 and the like) do not match these titles and still reach the feed.
  individual_exemptions:
    title_patterns: [Exemption Involving, Proposed Exemption, Exemptions From Certain Prohibited Transaction, Grant of Individual Exemption]
    keywords: [multiemployer, Taft-Hartley, welfare, health, medical, apprentice, training fund, trust fund, joint board, VEBA, voluntary employees, Local]
  # Document types that always reach the feed.
  keep_types: [Presidential Document]
  # Everything else, rules and proposed rules included, reaches the feed only when the title or
  # abstract names a benefits topic. The agency list includes all of HHS and IRS, so without this
  # FDA device classifications and IRS foreign-tax rules flood the feed.
  keywords:
    - ERISA
    - employee benefit
    - group health
    - health plan
    - health insurance
    - health coverage
    - welfare plan
    - welfare benefit
    - retirement plan
    - pension
    - multiemployer
    - Taft-Hartley
    - mental health parity
    - MHPAEA
    - COBRA
    - HIPAA
    - No Surprises
    - surprise billing
    - independent dispute resolution
    - transparency in coverage
    - prescription drug benefit
    - prescription drug coverage
    - RxDC
    - pharmacy benefit
    - cafeteria plan
    - dependent care
    - health reimbursement
    - ICHRA
    - wellness program
    - Trump Account
    - Form 5500
    - fiduciary
    - apprentice
    - prevailing wage
    - Davis-Bacon
    - fringe benefit
    - Medicare Secondary Payer
    - Affordable Care Act
    - employer shared responsibility
    - essential health benefits
    - qualified health plan
    - HSA
    - health savings account
    - flexible spending
    - Employee Benefits Security Administration
  # Titles matching any of these are dropped regardless (agency housekeeping).
  drop_title_patterns:
    - "Agency Information Collection"
    - "Information Collection Activities"
    - "Submission for Office of Management and Budget Review"
    - "Submission for OMB Review"
    - "Office of Management and Budget Review"
    - "Privacy Act of 1974"
    - "Patent License"
    - "Meeting of the"
    - "Notice of Meeting"
    - "Charter Renewal"
    - "Sunshine Act"
    - "Delegation of Authority"

# Per-source rules: category drops (RSS <category> values), title drops (substring), and
# require_keywords (the item must name a benefits topic in its title or summary; "federal_register"
# means the Federal Register keyword list above). Case-insensitive.
sources:
  groom:
    drop_categories: [Events, News]
    drop_title_patterns: [Webinar, Save the Date, Symposium]
  mercer:
    # Mercer's Law & Policy stream covers all of HR (immigration, DEI, minimum wage, pay transparency);
    # only its benefits items belong in this feed.
    require_keywords: [ERISA, employee benefit, benefit plan, benefits, health, welfare, retirement, pension, PBGC, 401(k), 403(b), COBRA, HIPAA, parity, Affordable Care, ACA, Medicare, EBSA, IRS, Trump account, HSA, FSA, dependent care]
  ifebp:
    drop_categories: [Canada]
  wagner:
    # The Google News fallback also returns attorney-bio and department pages from the site.
    drop_title_patterns: [" | The Wagner Law Group", "Chairs and Professionals", "Attorneys at Law", "Welcomes", "Joins The Wagner"]
  beneficiallyyours:
    drop_title_patterns: [Webinar, Save the Date]
  morganlewis:
    # Half the blog is executive compensation and equity plans.
    require_keywords: [ERISA, employee benefit, benefit plan, health, welfare, retirement, pension, PBGC, multiemployer, 401(k), 403(b), COBRA, HIPAA, parity, Affordable Care, EBSA, IRS, Trump account, HSA, FSA, dependent care, fiduciary]
  dol-ebsa-newsroom:
    require_keywords: [EBSA, Employee Benefits Security, ERISA, health plan, benefit plan, retirement, pension, 401(k), fiduciary, multiemployer, mental health parity, apprentice, Davis-Bacon, prevailing wage]
  hhs-ocr-newsroom:
    require_keywords: [HIPAA, Office for Civil Rights, breach, cybersecurity, ransomware, health plan, group health, No Surprises, surprise billing, mental health parity, Affordable Care Act, price transparency]
  regulations-gov:
    require_keywords: federal_register
    drop_title_patterns: ["Information Collection", "Submission for OMB Review", "Privacy Act of 1974"]
  irs-irb:
    # Most bulletin items are income-tax or pension-funding guidance; keep health and welfare, fringe
    # benefits, and multiemployer items.
    require_keywords: [health, welfare, medical, cafeteria, dependent care, HSA, health savings, flexible spending, HRA, health reimbursement, ICHRA, COBRA, Affordable Care, employer shared responsibility, 4980H, 6055, 6056, PCORI, MHPAEA, mental health parity, fringe benefit, educational assistance, Trump account, multiemployer, apprentice]
  cms-cciio:
    # The page also indexes Marketplace (exchange) guidance, which does not bind group health plans.
    require_keywords: [No Surprises, surprise billing, independent dispute, IDR, air ambulance, transparency, price comparison, group health, health plan issuers and group, mental health parity, MHPAEA, prescription drug, RxDC, gag clause, cost sharing, out-of-pocket, preventive, contraceptive, excepted benefit, short-term, grandfathered, HIPAA, COBRA, ICHRA, health reimbursement, wellness, advanced explanation of benefits]
  nccmp:
    # Conference presentations; keep the health, welfare, and training ones, not the pension-only sessions.
    require_keywords: [health, welfare, surprise billing, No Surprises, IDR, independent dispute, parity, Affordable Care, ACA, HIPAA, COBRA, prescription, pharmacy, apprentice, training, Taft-Hartley, legislative]
  courtlistener-cal-district:
    # "(PS)" marks a pro se case in the Eastern District's captions.
    drop_title_patterns: ["(PS) "]
  ca-dmhc:
    drop_title_patterns: [Medi-Cal, Joint Statement]
