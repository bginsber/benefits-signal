  - name: Morgan Lewis ML BeneBits
    id: morganlewis
    method: rss
    url: https://www.morganlewis.com/rss/blogs?category=mlbenebits&top=25  # found via the blog page's feed link; verified 2026-09-23 via branch preview: 25 items, newest 2026-09-01; about monthly
    notes: Benefits and executive-compensation blog; spec/feed-filter.yaml keeps only its benefits posts. Covers multiemployer topics (SFA plans, Roth catch-up for multiemployer plans).
    scans: [fhw, met]
    active: true

  - name: NCCMP Resources
    id: nccmp
    method: rss
    url: https://nccmp.org/feed/?post_type=resource  # the site's default /feed/ is valid but empty; resources are a custom post type. Verified 2026-09-23 via branch preview: 10 items, newest 2026-09-15, 4 in 30 days
    notes: >
      National Coordinating Committee for Multiemployer Plans: conference presentations, comment letters,
      and legislative updates for jointly administered plans. spec/feed-filter.yaml keeps the health,
      welfare, and training items and drops pension-only sessions.
    scans: [met, fhw]
    active: true

primary:
  - name: Federal Register API
    id: federal-register
    method: api
    agencies:                                # verified slugs; one API call covers them all
      - employee-benefits-security-administration
      - internal-revenue-service
      - employment-and-training-administration
      - wage-and-hour-division
      - health-and-human-services-department
      - centers-for-medicare-medicaid-services
    url: https://www.federalregister.gov/api/v1/documents.json
    auth: none
    notes: >
      THE reliable primary channel for EBSA/IRS/ETA/WHD/HHS/CMS regulatory documents,
      with structured comment_date and effective_date fields. Verified agency slugs:
      employee-benefits-security-administration, internal-revenue-service,
      employment-and-training-administration, wage-and-hour-division,
      health-and-human-services-department, centers-for-medicare-medicaid-services.
      Example (verified): ?conditions[agencies][]=employee-benefits-security-administration
      &conditions[publication_date][gte]=2026-07-01&per_page=20
      &fields[]=title&fields[]=publication_date&fields[]=agency_names
      Cursor paging via next_page_url.
    scans: [fhw, met, cyb, atf]
    active: true

  - name: Comment Deadlines (regulations.gov)
    id: regulations-gov
    method: api
    url: https://api.regulations.gov/v4      # /documents verified from Actions 2026-09-23 with DEMO_KEY (39 open EBSA/IRS/CMS documents)
    collector: regulations-gov
    agencies: [EBSA, IRS, CMS, HHS, ETA, WHD]
    auth: api-key                            # REGULATIONS_GOV_API_KEY when set, else api.data.gov's DEMO_KEY (rate-limited per IP; one call per run)
    notes: >
      Open comment periods closing within two weeks, one reminder per document, dated two weeks before
      the deadline and linked to the regulations.gov comment page. The Federal Register entry announces
      a document when it publishes; this one brings it back while there is still time to comment.
      spec/feed-filter.yaml applies the Federal Register keyword list. A free api.data.gov key avoids
      DEMO_KEY's shared rate limit if runs start failing with HTTP 429.
    scans: [fhw, cyb, atf]
    active: true

  - name: Ninth Circuit Opinions
    id: courtlistener
    method: api
    url: https://www.courtlistener.com/api/rest/v4/search/
    collector: courtlistener          # anonymous search works; COURTLISTENER_TOKEN env var is sent when present
    court: ca9
    query: ERISA OR "employee benefit plan" OR "Taft-Hartley" OR "Mental Health Parity"
    auth: none-for-search               # docket alerts endpoint requires a free account token
    notes: >
      Verified: ?q=ERISA&type=o&court=ca9&order_by=dateFiled+desc returns Ninth Circuit
      opinions (type=o opinions, type=r RECAP dockets). Docket-alerts endpoint
      (/api/rest/v4/docket-alerts/) confirmed, 401 without token — register a free
      account for alerts on watch-list cases.
    scans: [ca9]
    active: true

  - name: Supreme Court & Other Circuits
    id: courtlistener-appellate
    method: api
    url: https://www.courtlistener.com/api/rest/v4/search/
    collector: courtlistener
    court: scotus ca1 ca2 ca3 ca4 ca5 ca6 ca7 ca8 ca10 ca11 cadc   # ca9 has its own, broader entry above
    query: ERISA AND ("multiemployer" OR "Taft-Hartley" OR "welfare fund" OR "health plan" OR "welfare plan" OR "Mental Health Parity" OR "delinquent contributions" OR "1145")
    notes: >
      Welfare-fund ERISA opinions outside the Ninth Circuit, narrowed to trust-fund terms so
      routine disability-denial appeals stay out. Verified 2026-09-23 via the CourtListener
      search API: 4 opinions filed 2026-08-24 to 09-23 (three Seventh Circuit Central States
      opinions, one Second Circuit).
    scans: [fhw, met]
    active: true

  - name: California District Courts
    id: courtlistener-cal-district
    method: api
    url: https://www.courtlistener.com/api/rest/v4/search/
    collector: courtlistener
    search_type: r                    # RECAP dockets; CourtListener's district-court opinion collection for these courts ends in 2019
    court: cand cacd casd caed
    query: ERISA AND ("multiemployer" OR "Taft-Hartley" OR "welfare fund" OR "health plan" OR "welfare plan" OR "Mental Health Parity" OR "delinquent contributions" OR "1145" OR "trust fund")
    notes: >
      ERISA rulings from the four California federal district courts, narrowed to welfare-fund terms like
      the appellate entry. Reads RECAP (PACER documents CourtListener holds) because the opinion search has
      no California district opinions after 2019 (checked 2026-09-23: newest N.D. Cal. ERISA opinion is
      2019-04-05). The parser keeps only orders, judgments, and findings on dockets whose nature of suit or
      cause is ERISA; filings, protective and scheduling orders, and attachments are dropped. Coverage is
      limited to documents someone has pulled from PACER into RECAP. Verified 2026-09-23 with the
      CourtListener connector: 10 dockets with matching entries 2026-08-24 to 09-23.
    scans: [ca9, fhw, met]
    active: true

  - name: DOL News Releases
    id: dol-ebsa-newsroom
    method: rss
    url: https://www.dol.gov/rss/releases.xml   # verified 2026-09-23 via branch preview: 10 items, newest 2026-09-17
    notes: >
      All-DOL release feed (OSHA, UI claims, H-2A); spec/feed-filter.yaml keeps only EBSA, benefits,
      apprenticeship, and prevailing-wage items. dol.gov 403'd datacenter IPs on 2026-09-01 and answered
      from Actions on 2026-09-23; a 403 is logged as a source failure and the run continues.
    scans: [fhw, met, cyb, atf]
    active: true

  - name: IRS Internal Revenue Bulletin
    id: irs-irb
    method: scrape
    collector: irb
    url: https://www.irs.gov/internal-revenue-bulletins   # weekly bulletins at /irb/YYYY-WW_IRB; verified 200 from Actions 2026-09-23
    notes: >
      The "Highlights of This Issue" synopses of each weekly bulletin: every notice, revenue procedure,
      revenue ruling, and proposed or final regulation, under its section (Employee Plans, Income Tax,
      ...). No IRS RSS exists (newsroom/feed 404; GovDelivery answers 406). The news-release listing is
      mostly filing-season and tax-credit items and the IRS-drop table has document numbers without
      subjects, so the bulletin is the channel for written guidance. spec/feed-filter.yaml keeps
      health-and-welfare items.
    scans: [fhw]
    active: true

  - name: HHS News Releases
    id: hhs-ocr-newsroom
    method: rss
    url: https://www.hhs.gov/rss/news.xml   # verified 2026-09-23 via branch preview: 10 items, newest 2026-09-22
    notes: >
      Department-wide release feed; OCR HIPAA settlements and coverage rules are announced here.
      spec/feed-filter.yaml keeps only HIPAA, privacy/breach, and group-coverage items.
    scans: [cyb, fhw]
    active: true

  - name: CMS Private Insurance Guidance (CCIIO)
    id: cms-cciio
    method: scrape
    collector: dated-list
    url: https://www.cms.gov/marketplace/resources/regulations-guidance   # verified 200 from Actions 2026-09-23; plain HTML, dated entries under topic headings
    notes: >
      CCIIO's regulations-and-guidance index: No Surprises Act, transparency, parity, and Marketplace
      guidance as dated links under topic headings. spec/feed-filter.yaml keeps the group-health topics.
      The CMS newsroom has no RSS (cms.gov/newsroom/rss 404; the RSS page lists no feeds) and GovDelivery
      answers 406, so this page is the CMS channel for group-health guidance.
    scans: [fhw]
    active: true

  - name: DOL Office of Apprenticeship / ETA
    id: dol-oa-eta
    method: api
    collector: none                          # ETA/WHD are in the Federal Register entry's agencies list; nothing to fetch separately
    url: https://www.federalregister.gov/api/v1/documents.json   # ETA + WHD agency filters
    also: https://www.apprenticeship.gov/investments-tax-credits-and-tuition-support
    notes: >
      apprenticeship.gov has NO newsroom page (verified: /news and variants 404);
      funding announcements surface on the investments page; OA press goes through
      the dol.gov newsroom (see its caveat). Federal Register ETA filter is the
      dependable channel for 29 CFR 29/30 rulemaking.
    scans: [atf]
    active: true

  - name: California DMHC
    id: ca-dmhc
    method: scrape
    collector: dmhc
    urls:
      - https://www.dmhc.ca.gov/LicensingReporting/HealthPlanLicensing/AllPlanLetters.aspx   # verified 200 from Actions 2026-09-23
      - https://www.dmhc.ca.gov/Resources/Newsroom/PressReleases.aspx                        # verified 200 from Actions 2026-09-23
    notes: >
      Department of Managed Health Care All Plan Letters, All Licensee Letters (PBM licensure), and
      enforcement press releases: the California rules for the insured HMO and PPO arrangements that
      funds buy. No RSS or GovDelivery feed answers (GovDelivery 406). spec/feed-filter.yaml drops
      Medi-Cal-only letters. 14 letters and 5 releases in 2026; 4 items 2026-08-24 to 09-23.
    scans: [ca9, fhw]
    active: true

  - name: California DAS / DIR / CAC
    id: ca-das
    method: scrape
    collector: ca-das                 # DIR "What's New" table and CAC meeting tables; plain HTML
    urls:
      - https://www.dir.ca.gov/das/das.html                # DAS home (verified)
      - https://www.dir.ca.gov/das/publicworks.html        # public-works apprenticeship (verified)
      - https://www.dir.ca.gov/das/DAS_CACMeetings.html    # CAC 2026 meetings (verified; NOT DASMeetings.html, which is stale/2019)
      - https://www.dir.ca.gov/cac/cac.html                # CAC overview (verified)
    notes: Plain HTML, curl-friendly.
    scans: [atf, ca9]
    active: true
