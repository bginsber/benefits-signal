    active: true

  - name: Beneficially Yours (Seyfarth)
    id: beneficiallyyours
    method: rss
    url: https://www.beneficiallyyours.com/feed/  # verified 2026-09-23 via branch preview: 10 items, newest 2026-09-10, 5 in 30 days (MHPAEA roadmap, DCAP regulations, wellness FAQs)
