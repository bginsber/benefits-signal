    active: true

  - name: Benefits Law Advisor
    id: benefitslawadvisor
    method: rss
    url: https://www.benefitslawadvisor.com/feed/  # verified 2026-09-23 via branch preview: 10 items, newest 2026-09-09 (multiemployer SFA challenge to PBGC); low cadence
