    scans: [fhw, cyb]
    active: true

  - name: ERIC Policy Highlights
    id: eric
    method: rss
    url: https://www.eric.org/feed/  # verified 2026-09-23 via branch preview: 10 items, newest 2026-09-18, 7 in 30 days, all on benefits policy
    notes: >
      The ERISA Industry Committee's weekly health-care and retirement policy digests: agency guidance,
      litigation, and bills from the plan-sponsor side. Advocacy commentary, not law-firm analysis.
