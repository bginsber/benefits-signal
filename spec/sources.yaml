# Benefits Signal — source configuration (Phase 0)
# All URLs below were fetch-verified on 2026-09-01 unless marked otherwise.
# layer: interpretation | supplemental | primary
#   interpretation = the seven curated publications the digest is built around (AGENTS.md)
#   supplemental   = extra commentary feeds that widen the Outlook feed toward BenefitsLink-style
#                    coverage without joining the curated seven
# method: rss | scrape | scrape-js | email | api
# Scan keys: fhw = Federal Health & Welfare, met = Multiemployer & Taft-Hartley,
#            ca9 = California & Ninth Circuit, cyb = Cybersecurity & Privacy,
#            atf = Apprenticeship & Training Funds

interpretation:
  - name: EBIA Weekly
    id: ebia
    method: email                     # NO public feed; public EBIA blog stale since mid-2023
    inbox: benefits-signal@<firm-domain>   # dedicated subscriptions-only mailbox
    notes: Thomson Reuters Checkpoint subscription email is the only viable channel.
    scans: [fhw, cyb, met]
    active: true

  - name: Mercer Law & Policy Group
    id: mercer
    method: scrape                    # no RSS declared; listing is JS-rendered
    url: https://www.mercer.com/insights/law-and-policy/
    collector: mercer-search          # the page's own search backend (Elastic App Search), verified 2026-09-01
    search_endpoint: https://mer-us-ue1-elastic-prd-dotcom.ent.us-east-1.aws.found.io
    search_engine: prd-mercer-dotcom-glb-en
    search_key: search-g6unhkn3scaaybwpwtq3qfq2   # public read-only search key embedded in the page for every visitor; not a secret
    query: law and policy
    path_prefix: /insights/law-and-policy/       # keep only law-and-policy articles from the search results
    notes: Listing may be partly JS-loaded — verify the scraper sees article cards.
           Backup: monthly Global Legislative Update email signup on the same page.
    scans: [fhw]
    active: true

  - name: Segal Compliance News
    id: segal
    method: scrape-js                 # raw HTML shows zero articles; JS-rendered listing
    url: https://www.segalco.com/consulting-insights/compliance-news/
    collector: segal-insights         # the listing's own JSON endpoint (Umbraco), verified 2026-09-01; startNode 1192 = Compliance News
    api: https://www.segalco.com/Umbraco/Api/getinsights/getInsights?startNode=1192
    notes: Needs headless rendering or the underlying XHR/JSON endpoint (find during Phase 0).
           Pre-Sep-2024 content lives in a separate insights archive.
    scans: [fhw, met]
    active: true

  - name: Groom Law Group
    id: groom
    method: rss
    url: https://www.groom.com/feed/  # verified valid; items dated Sep 1 / Aug 31 2026
    notes: Feed mixes events/webinars with alerts — filter by category/keywords.
    scans: [fhw, met, ca9, cyb]
    active: true

  - name: Trucker Huss Benefits Report
    id: truckerhuss
    method: rss
    url: https://www.truckerhuss.com/feed/  # verified valid; ~monthly cadence
    scans: [ca9, fhw, met]
    active: true

  - name: Wagner Law Group Law Alerts
    id: wagner
    method: rss
    url: https://www.wagnerlawgroup.com/feed/  # verified valid Aug 2026. Whole site is behind a Cloudflare managed challenge (cf-mitigated: challenge) that 403s some client IPs intermittently — blocked 2 of 3 Actions runs on 2026-09-01; collector logs a warning and continues
    fallback_url: https://news.google.com/rss/search?q=site:wagnerlawgroup.com+when:30d&hl=en-US&gl=US&ceid=US:en
    fallback_label: Google News
    fallback_title_suffix: " - The Wagner Law Group"
    notes: >
      Includes general firm/media items — filter to law alerts / ERISA categories. When the site's
      Cloudflare challenge 403s the collector, the items come from a Google News RSS search limited to
      wagnerlawgroup.com (a public feed of Google's own index of the site; nothing is fetched from
      Wagner's servers, so the challenge is not touched). Links then go through news.google.com.
      spec/feed-filter.yaml drops the attorney-bio and department pages that search also returns.
    scans: [fhw, met, cyb]
    active: true

  - name: Word on Benefits (IFEBP)
    id: ifebp
    method: rss
    url: https://blog.ifebp.org/feed/  # verified valid RSS 2.0; very active
    notes: wordonbenefits.org resolves here. Weight apprenticeship/training posts to atf.
    scans: [fhw, met, atf]
    active: true

supplemental:
  - name: Proskauer ERISA Practice Center
    id: proskauer
    method: rss
